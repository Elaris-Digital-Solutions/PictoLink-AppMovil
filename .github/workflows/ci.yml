# Gate de PR. Corre lo mismo que `npm run verify:full` en local, en el mismo
# orden, pero como pasos separados: cuando falla, el nombre del paso ya dice
# qué se rompió sin abrir el log.
#
# Medido el 2026-08-28 apartando `.env.local`: build y humo pasan con el
# entorno vacío, así que este workflow no necesita secrets. Eso también lo
# hace válido en PRs desde forks, que en un repo público es el caso normal.
# Desde E.1.5 (2026-11-01) el humo comprueba que las rutas de API den 401 sin
# sesión, y para eso el cliente de Supabase tiene que poder construirse: el job
# `gate` lleva una URL y una clave de RELLENO (no son secretos, no apuntan a
# ningún proyecto). Sin ellas esas 4 rutas dan 500. Sin sesión, getUser() no
# hace ninguna llamada de red, así que el relleno basta.

name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Un push nuevo al mismo PR cancela el run anterior: no se gastan minutos
# verificando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # A nivel de job y no del paso de humo: Next incrusta NEXT_PUBLIC_* al compilar,
    # también en el código de servidor, así que el build tiene que verlas.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-relleno-no-es-un-secreto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Lo rápido va primero: el lint corta antes de gastar el build.
      # El techo de avisos está en el propio script (--max-warnings), así
      # que un aviso nuevo pone el PR en rojo sin que haya que recordarlo.
      # Bajó de 88 a 3 en E.1.5: los otros 85 se fueron con el código a mobile/.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitarios
        run: npm run test:run

      - name: Build
        run: npm run build

      # Levanta web/ compilada (landing + API) y la interroga por HTTP.
      # No cubre flujos autenticados: eso sigue siendo verificación a mano.
      - name: Humo sobre la app corriendo
        run: npm run test:smoke

  # La SPA que va a Capacitor (Bloque E). Job aparte y no un paso más de
  # `gate`: tiene su propio package.json, y si falla el nombre del job ya dice
  # cuál de las dos apps se rompió. Si se activa la protección de rama, este
  # check también tiene que ser obligatorio: uno que no bloquea es documentación.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # Copias que usan las dos apps (E.1.3). Idénticas o rojo: si divergen, el
      # test de SEC-2 de web/ deja de probar el código que corre en mobile/.
      - name: Copias compartidas idénticas
        working-directory: .
        run: |
          for f in lib/cloudinary.ts lib/ai/picto-nlp.ts lib/ai/hf-client.ts types/index.ts; do
            cmp "web/$f" "mobile/$f"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Techo 86 (E.1, 2026-10-31): los 85 avisos que se mudaron de web/ más 1
      # de `@next/next/no-img-element` por el <img> que sustituyó a next/image.
      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm run test:run

      # `build` incluye el typecheck (tsc --noEmit && vite build).
      - name: Build
        run: npm run build
